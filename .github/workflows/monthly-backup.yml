name: Arquivamento Mensal — Backup D360

# Roda às 02:50 UTC do dia 1 de cada mês = 23:50 BRT do último dia do mês anterior
on:
  schedule:
    - cron: '50 2 1 * *'
  workflow_dispatch:   # permite rodar manualmente se necessário

concurrency:
  group: monthly-backup
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar arquivamento mensal
        env:
          INDEX_HTML: index.html
        run: python scripts/monthly_archive.py

      - name: Verificar alterações
        id: diff
        run: |
          git diff --quiet historico_360.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit do backup e histórico
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "D360-Bot"
          git config user.email "bot@titas-sinergy.web.app"
          git add historico_360.json backups/
          PERIODO=$(TZ=America/Sao_Paulo date -d "yesterday" +'%b %Y' 2>/dev/null || date -v-1d +'%b %Y')
          git commit -m "backup: arquivamento mensal $PERIODO"
          git pull --rebase origin main
          git push

      - name: Instalar Firebase CLI
        if: steps.diff.outputs.changed == 'true'
        run: npm install -g firebase-tools --silent

      - name: Deploy Firebase Hosting
        if: steps.diff.outputs.changed == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
          echo "✅ Deploy concluído — historico_360.json com novo mês publicado"

      - name: Resumo
        run: |
          echo "## Arquivamento concluído ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Mês arquivado: $(TZ=America/Sao_Paulo date -d 'yesterday' +'%B %Y' 2>/dev/null || echo 'mês anterior')" >> $GITHUB_STEP_SUMMARY
          echo "- Firestore: ts_d360_historico atualizado" >> $GITHUB_STEP_SUMMARY
          echo "- historico_360.json: atualizado e publicado" >> $GITHUB_STEP_SUMMARY
          echo "- Backup salvo em: backups/$(date -d 'yesterday' +'%Y_%m' 2>/dev/null || date +'%Y_%m')/" >> $GITHUB_STEP_SUMMARY
